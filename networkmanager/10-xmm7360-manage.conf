## /etc/NetworkManager/conf.d/10-xmm7360-manage.conf
##
## Tell NetworkManager to MANAGE the wwan0 interface instead of leaving it
## as "unmanaged" (which is the default for raw-IP POINTOPOINT / WWAN links
## on Arch-family distros). Without this, `nmcli con up xmm7360` complains
## that the device is unmanaged.

[device-xmm7360]
match-device=interface-name:wwan0
managed=true
