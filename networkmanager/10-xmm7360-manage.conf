## /etc/NetworkManager/conf.d/10-xmm7360-manage.conf
##
## wwan0 is a raw-IP POINTOPOINT/NOARP interface which NetworkManager
## classifies as 'generic' and leaves unmanaged by default. Force it
## managed so `nmcli con up xmm7360` works.

[keyfile]
unmanaged-devices=none

[device-xmm7360]
match-device=interface-name:wwan0
managed=1
